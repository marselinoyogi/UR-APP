<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UR-APP - Sistem Pengelolaan Umpan Balik Pengguna</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js for Dashboards & Metrics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z'/></svg>">
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

  <!-- Main Top Navigation Bar -->
  <header id="app-header" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <!-- Rendered dynamically by app.js -->
  </header>

  <!-- Main App Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="app-main-content">
      <!-- Loading skeleton -->
      <div class="animate-pulse space-y-4 py-8">
        <div class="h-10 bg-slate-200 rounded-xl w-1/4"></div>
        <div class="grid grid-cols-4 gap-4">
          <div class="h-24 bg-slate-200 rounded-xl"></div>
          <div class="h-24 bg-slate-200 rounded-xl"></div>
          <div class="h-24 bg-slate-200 rounded-xl"></div>
          <div class="h-24 bg-slate-200 rounded-xl"></div>
        </div>
        <div class="h-64 bg-slate-200 rounded-xl"></div>
      </div>
    </div>
  </main>

  <!-- Interactive Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-700">UR-APP (User Response App)</span>
        <span>•</span>
        <span>Sistem Layanan Keluhan, Bug & Saran Berbasis Firebase</span>
      </div>
      <div class="flex items-center gap-4 text-slate-400">
        <span>Sesuai Dokumen Perancangan Konsep Web Aplikasi</span>
        <span>•</span>
        <button onclick="window.confirmResetDatabase()" class="hover:text-rose-600 underline">Reset Demo</button>
      </div>
    </div>
  </footer>

  <!-- ======================================================== -->
  <!-- MODAL: DETAIL TIKET & PERCAKAPAN                         -->
  <!-- ======================================================== -->
  <div id="ticket-detail-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6 hidden">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-5xl max-h-[92vh] overflow-hidden flex flex-col transform transition-all animate-in fade-in zoom-in-95 duration-200">
      <div id="ticket-detail-content">
        <!-- Rendered by TicketDetail.render() -->
      </div>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- MODAL: FORMULIR BUAT LAPORAN TIKET BARU                 -->
  <!-- ======================================================== -->
  <div id="create-ticket-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6 hidden">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-3xl max-h-[92vh] overflow-hidden flex flex-col transform transition-all animate-in fade-in zoom-in-95 duration-200">
      <div id="create-ticket-content">
        <!-- Rendered by CreateTicketModal.render() -->
      </div>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- MODAL: DIALOG AKSI (REOPEN / SOLVE NOTES)                 -->
  <!-- ======================================================== -->
  <div id="action-dialog-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden transform transition-all">
      <div id="action-dialog-content"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-auto"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
